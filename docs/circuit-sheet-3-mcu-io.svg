<rect x="80" y="745" width="1440" height="190" rx="3" class="bx"/>
<text x="100" y="770" font-size="12" text-anchor="start" class="" font-weight="600">FIRMWARE NOTES</text>
<text x="100" y="798" font-size="10.5" text-anchor="start" class="g">· ADC1 only (GPIO32–39); ADC2 is unavailable while Wi-Fi is active.</text>
<text x="100" y="820" font-size="10.5" text-anchor="start" class="g">· GPIO34/35 are input-only — the external bias tee sets 1.65 V.</text>
<text x="100" y="842" font-size="10.5" text-anchor="start" class="g">· Remove the per-window mean before RMS/THD; never normalise the CNN input.</text>
<text x="100" y="864" font-size="10.5" text-anchor="start" class="g">· 2 kHz sampler pinned to core 1; a Wi-Fi stall discards the partial window.</text>
<text x="820" y="798" font-size="10.5" text-anchor="start" class="g">· safety::begin() drives the relay open before pinMode(OUTPUT).</text>
<text x="820" y="820" font-size="10.5" text-anchor="start" class="g">· Boot keeps it open until 3 consecutive healthy evaluations.</text>
<text x="820" y="842" font-size="10.5" text-anchor="start" class="g">· Reset only requests re-arm; it cannot force the relay closed.</text>
<text x="820" y="864" font-size="10.5" text-anchor="start" class="g">· A welded contact is not detectable — use a certified contactor.</text>
<text x="100" y="906" font-size="10" text-anchor="start" class="g">Full rationale and acceptance tests: docs/hardware-design.md · wiring.md</text>
