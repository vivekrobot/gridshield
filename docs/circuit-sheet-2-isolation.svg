<text x="692" y="286" font-size="9" text-anchor="end" class="g">IN−</text>
<line x1="860" y1="250" x2="1080" y2="250" class="w"/>
<line x1="860" y1="290" x2="1040" y2="290" class="w"/>
<rect x="700" y="380" width="160" height="80" rx="3" class="bf"/>
<text x="780" y="404" font-size="12" text-anchor="middle" class="" font-weight="600">ISO1 · ADuM1201</text>
<text x="780" y="422" font-size="10" text-anchor="middle" class="g">2-channel digital</text>
<text x="780" y="438" font-size="10" text-anchor="middle" class="g">isolator</text>
<path d="M360 400 L560 400 L560 410 L700 410" class="w"/>
<path d="M700 440 L570 440 L570 430 L360 430" class="w"/>
<line x1="860" y1="410" x2="1000" y2="410" class="w"/>
<line x1="860" y1="440" x2="1000" y2="440" class="w"/>
<rect x="1000" y="330" width="180" height="140" rx="3" class="bf"/>
<text x="1090" y="356" font-size="13" text-anchor="middle" class="" font-weight="600">J1</text>
<text x="1090" y="376" font-size="11" text-anchor="middle" class="">PZEM #1 TTL</text>
<text x="1090" y="442" font-size="9" text-anchor="middle" class="g">5V GND TX RX</text>
<text x="1090" y="460" font-size="9" text-anchor="middle" class="g">→ Sheet 1</text>
<line x1="1080" y1="250" x2="1080" y2="330" class="w"/>
<line x1="1040" y1="290" x2="1040" y2="330" class="w"/>
<text x="1080" y="324" font-size="9" text-anchor="middle" class="g">5V</text>
<text x="1040" y="324" font-size="9" text-anchor="middle" class="g">GND</text>
<rect x="700" y="470" width="160" height="100" rx="3" class="bf"/>
<text x="780" y="494" font-size="12" text-anchor="middle" class="" font-weight="600">PS3 · B0505S-1W</text>
<text x="780" y="512" font-size="10" text-anchor="middle" class="g">5 V → 5 V isolated</text>
<text x="780" y="528" font-size="10" text-anchor="middle" class="g">1 W, 200 mA</text>
<line x1="660" y1="520" x2="700" y2="520" class="w"/>
<circle cx="660" cy="520" r="4.5" class="j"/>
<line x1="620" y1="560" x2="700" y2="560" class="w"/>
<circle cx="620" cy="560" r="4.5" class="j"/>
<line x1="860" y1="520" x2="1040" y2="520" class="w"/>
<line x1="860" y1="560" x2="1080" y2="560" class="w"/>
<line x1="1040" y1="520" x2="1040" y2="600" class="w"/>
<line x1="1080" y1="560" x2="1080" y2="600" class="w"/>
<rect x="700" y="640" width="160" height="80" rx="3" class="bf"/>
<text x="780" y="664" font-size="12" text-anchor="middle" class="" font-weight="600">ISO2 · ADuM1201</text>
<text x="780" y="682" font-size="10" text-anchor="middle" class="g">2-channel digital</text>
<text x="780" y="698" font-size="10" text-anchor="middle" class="g">isolator</text>
<path d="M360 540 L520 540 L520 680 L700 680" class="w"/>
<path d="M700 710 L540 710 L540 570 L360 570" class="w"/>
<line x1="860" y1="680" x2="1000" y2="680" class="w"/>
<line x1="860" y1="710" x2="1000" y2="710" class="w"/>
<rect x="1000" y="600" width="180" height="140" rx="3" class="bf"/>
<text x="1090" y="626" font-size="13" text-anchor="middle" class="" font-weight="600">J2</text>
<text x="1090" y="646" font-size="11" text-anchor="middle" class="">PZEM #2 TTL</text>
<text x="1090" y="712" font-size="9" text-anchor="middle" class="g">5V GND TX RX</text>
<text x="1090" y="730" font-size="9" text-anchor="middle" class="g">→ Sheet 1</text>
<text x="1040" y="594" font-size="9" text-anchor="middle" class="g">5V</text>
<text x="1080" y="594" font-size="9" text-anchor="middle" class="g">GND</text>
<rect x="1210" y="180" width="330" height="560" rx="3" class="bx"/>
<text x="1232" y="210" font-size="13" text-anchor="start" class="" font-weight="600">ISOLATION NOTES</text>
<text x="1232" y="238" font-size="11" text-anchor="start" class="g">Never bridge GND and GND_ISO.</text>
<text x="1232" y="256" font-size="11" text-anchor="start" class="g">Each PZEM gets its own isolated 5 V.</text>
<text x="1232" y="286" font-size="11" text-anchor="start" class="" font-weight="600">Without the barrier:</text>
<text x="1232" y="306" font-size="11" text-anchor="start" class="g">· the ESP32, USB port and laptop</text>
<text x="1232" y="324" font-size="11" text-anchor="start" class="g">  reference mains; do not touch.</text>
<text x="1232" y="342" font-size="11" text-anchor="start" class="g">· a 1 k / 2 k divider on PZEM TX</text>
<text x="1232" y="360" font-size="11" text-anchor="start" class="g">  protects the pin, but is NOT</text>
<text x="1232" y="378" font-size="11" text-anchor="start" class="g">  galvanic isolation.</text>
<text x="1232" y="412" font-size="11" text-anchor="start" class="" font-weight="600">Barrier parts:</text>
<text x="1232" y="432" font-size="11" text-anchor="start" class="g">· 1 W isolated DC-DC (B0505S-1W)</text>
<text x="1232" y="450" font-size="11" text-anchor="start" class="g">· 2-channel digital isolator</text>
<text x="1232" y="468" font-size="11" text-anchor="start" class="g">  (ADuM1201 / Si862x, ≥1 kV)</text>
<text x="1232" y="486" font-size="11" text-anchor="start" class="g">· or a certified RS485 meter</text>
<text x="1232" y="504" font-size="11" text-anchor="start" class="g">  (Eastron SDM120 + isolated</text>
<text x="1232" y="522" font-size="11" text-anchor="start" class="g">  RS485 transceiver).</text>
<text x="1232" y="562" font-size="11" text-anchor="start" class="g">UART: 9600 8N1, Modbus RTU.</text>
<text x="1232" y="580" font-size="11" text-anchor="start" class="g">Keep the isolated side's ground</text>
<text x="1232" y="598" font-size="11" text-anchor="start" class="g">separate from the SELV ground.</text>
<text x="1232" y="628" font-size="11" text-anchor="start" class="g">Psst: 3.3 V TX is accepted as</text>
<text x="1232" y="646" font-size="11" text-anchor="start" class="g">HIGH by the PZEM's 5 V input.</text>
<rect x="80" y="760" width="760" height="172" rx="3" class="bx"/>
<text x="100" y="786" font-size="12" text-anchor="start" class="" font-weight="600">POWER BUDGET — 5 V SELV RAIL</text>
<text x="100" y="814" font-size="11" text-anchor="start" class="" font-weight="600">ESP32 + Wi-Fi</text>
<text x="280" y="814" font-size="11" text-anchor="start" class="g">100 mA typ · 240 mA peak (TX)</text>
<text x="100" y="838" font-size="11" text-anchor="start" class="" font-weight="600">PZEM #1 + #2</text>
<text x="280" y="838" font-size="11" text-anchor="start" class="g">40 mA total, plus DC-DC losses</text>
<text x="100" y="862" font-size="11" text-anchor="start" class="" font-weight="600">K1 relay coil</text>
<text x="280" y="862" font-size="11" text-anchor="start" class="g">70 mA while energised</text>
<text x="100" y="886" font-size="11" text-anchor="start" class="" font-weight="600">LEDs + buzzer</text>
<text x="280" y="886" font-size="11" text-anchor="start" class="g">15 mA typ · 40 mA peak</text>
<text x="100" y="910" font-size="11" text-anchor="start" class="" font-weight="600">Supply</text>
<text x="280" y="910" font-size="11" text-anchor="start" class="g">5 V / 1 A isolated, 470 µF bulk at the ESP32</text>
<rect x="24" y="952" width="1552" height="72" rx="4" class="bx"/>
<line x1="1150" y1="952" x2="1150" y2="1024" class="w"/>
<line x1="1330" y1="952" x2="1330" y2="1024" class="w"/>
<text x="48" y="982" font-size="16" text-anchor="start" class="" font-weight="600">GridShield — 230 V single-phase edge node</text>
<text x="48" y="1006" font-size="11" text-anchor="start" class="g">PZEM UART/power barrier, isolated supplies and connector pinout</text>
<text x="1170" y="982" font-size="13" text-anchor="start" class="">Sheet 2 of 3</text>
<text x="1170" y="1006" font-size="11" text-anchor="start" class="g">Rev A · 2026-11-02</text>
<text x="1350" y="982" font-size="13" text-anchor="start" class="">Prototype</text>
<text x="1350" y="1006" font-size="11" text-anchor="start" class="g">not certified</text>
</svg>
