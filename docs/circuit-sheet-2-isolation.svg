<line x1="620" y1="290" x2="620" y2="560" class="w"/>
<rect x="700" y="210" width="160" height="100" rx="3" class="bf"/>
<text x="780" y="234" font-size="12" text-anchor="middle" class="" font-weight="600">PS2 · B0505S-1W</text>
<text x="780" y="252" font-size="10" text-anchor="middle" class="g">5 V → 5 V isolated</text>
<text x="780" y="268" font-size="10" text-anchor="middle" class="g">1 W, 200 mA</text>
