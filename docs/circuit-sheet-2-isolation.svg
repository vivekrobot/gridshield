<text x="292" y="580" font-size="9" text-anchor="end" class="g">UART1 RX1</text>
<line x1="360" y1="250" x2="660" y2="250" class="w"/>
<line x1="660" y1="250" x2="660" y2="282" class="w"/>
<path d="M660 281 A 9 9 0 0 1 660 299" class="w"/>
