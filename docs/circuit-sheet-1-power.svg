<text x="1170" y="982" font-size="13" text-anchor="start" class="">Sheet 1 of 3</text>
<text x="1170" y="1006" font-size="11" text-anchor="start" class="g">Rev A · 2026-11-02</text>
<text x="1350" y="982" font-size="13" text-anchor="start" class="">Prototype</text>
<text x="1350" y="1006" font-size="11" text-anchor="start" class="g">not certified</text>
