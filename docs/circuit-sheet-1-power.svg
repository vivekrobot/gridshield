<text x="146" y="646" font-size="11" text-anchor="start" class="g">PE / enclosure bond</text>
<rect x="1180" y="180" width="360" height="620" rx="3" class="bx"/>
<text x="1200" y="210" font-size="13" text-anchor="start" class="" font-weight="600">NOTES</text>
<text x="1200" y="240" font-size="11" text-anchor="start" class="g">1. MCB 6–10 A and a 30 mA RCD are</text>
<text x="1200" y="260" font-size="11" text-anchor="start" class="g">   mandatory upstream of everything.</text>
<text x="1200" y="280" font-size="11" text-anchor="start" class="g"></text>
<text x="1200" y="300" font-size="11" text-anchor="start" class="g">2. K1 is an additional load switch, not</text>
<text x="1200" y="320" font-size="11" text-anchor="start" class="g">   a protective device. Use a certified</text>
<text x="1200" y="340" font-size="11" text-anchor="start" class="g">   contactor for a real installation.</text>
<text x="1200" y="360" font-size="11" text-anchor="start" class="g"></text>
<text x="1200" y="380" font-size="11" text-anchor="start" class="g">3. The PZEM TTL header may be mains-</text>
<text x="1200" y="400" font-size="11" text-anchor="start" class="g">   referenced depending on the clone.</text>
<text x="1200" y="420" font-size="11" text-anchor="start" class="g">   Verify isolation before touching it;</text>
<text x="1200" y="440" font-size="11" text-anchor="start" class="g">   power and UART go through ISO1/ISO2</text>
<text x="1200" y="460" font-size="11" text-anchor="start" class="g">   on Sheet 2.</text>
<text x="1200" y="480" font-size="11" text-anchor="start" class="g"></text>
<text x="1200" y="500" font-size="11" text-anchor="start" class="g">4. Load current flows through the</text>
<text x="1200" y="520" font-size="11" text-anchor="start" class="g">   PZEM #1 internal shunt. Wire L in</text>
<text x="1200" y="540" font-size="11" text-anchor="start" class="g">   series, N as a voltage reference.</text>
<text x="1200" y="560" font-size="11" text-anchor="start" class="g"></text>
<text x="1200" y="580" font-size="11" text-anchor="start" class="g">5. Use 300 V / 10 A terminals, 6 mm</text>
<text x="1200" y="600" font-size="11" text-anchor="start" class="g">   creepage, and an enclosure barrier.</text>
<text x="1200" y="620" font-size="11" text-anchor="start" class="g"></text>
<text x="1200" y="640" font-size="11" text-anchor="start" class="g">6. A wire crossing without a dot is</text>
<text x="1200" y="660" font-size="11" text-anchor="start" class="g">   not a connection.</text>
