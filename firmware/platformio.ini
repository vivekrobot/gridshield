; PlatformIO project for the GridShield ESP32 edge node.
;
;   pio run -d firmware                 # build
;   pio run -d firmware -t upload       # flash
;   pio device monitor -b 115200        # serial log
;
; Copy firmware/arduino/gridshield_node/secrets.example.h to secrets.h first.

[platformio]
src_dir = arduino/gridshield_node

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DGS_DEVICE_ID=\"node-001\"
    -DGS_SITE_NAME=\"Demo household\"
